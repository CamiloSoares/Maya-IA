<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya IA - Realidade Virtual</title>
    <style>
        :root { --bg: #0b141a; --panel: #111b21; --accent: #00a884; --maya: #202c33; --user: #005c4b; --text: #e9edef; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #222d34; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sidebar img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 15px rgba(0,168,132,0.3); }
        .status { font-size: 11px; color: var(--accent); animation: pulse 1.5s infinite; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; position: relative; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .bubble { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.5; font-size: 14px; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 2px; }
        .maya { align-self: flex-start; background: var(--maya); border: 1px solid #313d45; border-bottom-left-radius: 2px; }
        .img-card { margin-top: 8px; border-radius: 8px; overflow: hidden; border: 2px solid var(--accent); background: #000; max-width: 400px; }
        .img-card img { width: 100%; display: block; height: auto; transition: opacity 0.5s; }
        .input-area { padding: 15px; background: var(--panel); border-top: 1px solid #222d34; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; background: #2a3942; border: 1px solid #313d45; padding: 12px; border-radius: 8px; color: white; outline: none; font-size: 14px; }
        button { background: var(--accent); border: none; padding: 12px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 14px; }
        #status-top { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--accent); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <img src="https://drive.google.com/thumbnail?id=14aBAq3ow-kFGGLHDGlb9-Q_fc3fHWmXV&sz=w500" alt="Maya">
        <h3>Maya IA</h3>
        <p class="status">● Realidade Total (v7.0)</p>
    </aside>
    <main class="chat-container">
        <div id="status-top">Pronta</div>
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Converse com a Maya real ou peça uma foto...">
            <button id="send-btn">Enviar</button>
        </div>
    </main>

<script>
    // 1. CONFIGURAÇÃO (Sua chave da Groq vai aqui!)
    const CHAVE_GROQ = "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"; 

    const chatWindow = document.getElementById('chat-window');
    const statusTop = document.getElementById('status-top');
    const inputField = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Memória e Instrução de Realidade Forçada (NUNCA USAR "3D" OU "PIXAR")
    let contexto = [
        { 
            role: "system", 
            content: "Você é a Maya, assistente virtual. Agora você é uma pessoa real, fotorealista, não mais 3D animação. Use emojis nativos. Se pedirem foto, descreva a cena como 'fotorealista, cinematic lighting, 8k resolution, photorealistic'. Termine com a tag: [GERAR_FOTO: descrição detalhada em inglês]. Exemplo: '[GERAR_FOTO: photorealistic portrait of Maya smiling, cinematic lighting]'" 
        }
    ];

    // --- FUNÇÃO DE ÁUDIO (VOZ) ---
    function falar(texto) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = texto.replace(/\[GERAR_FOTO:.*?\]/g, ""); // Remove a tag da foto
        msg.lang = 'pt-BR';
        msg.rate = 1.0; 
        window.speechSynthesis.speak(msg);
    }

    function addMessage(role, text, isImg = false) {
        const div = document.createElement('div');
        div.className = "bubble " + role;
        if(isImg) {
            div.className += " img-card";
            div.innerHTML = `<span>Carregando foto real...</span><img src="${text}" style="display:none; opacity:0;" onload="this.style.display='block'; setTimeout(()=>this.style.opacity='1', 50); this.previousSibling.style.display='none';" onerror="this.parentElement.innerHTML='Erro ao carregar a foto 📷';">`;
        } else {
            div.innerText = text; 
        }
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function processarAcao() {
        const text = inputField.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputField.value = "";
        contexto.push({ role: "user", content: text });
        statusTop.innerText = "Maya pensando...";

        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + CHAVE_GROQ, "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile", 
                    messages: contexto,
                    temperature: 0.7 
                })
            });

            if(!r.ok) {
                const erro = await r.json();
                throw new Error(erro.error.message || "Erro na API");
            }

            const data = await r.json();
            const aiResponse = data.choices[0].message.content;
            statusTop.innerText = "Pronta";

            // 1. Maya Fala (Áudio)
            falar(aiResponse);

            // 2. Lógica de Imagem Realista
            if(aiResponse.includes("[GERAR_FOTO:")) {
                const p = aiResponse.split("[GERAR_FOTO:");
                const descFoto = p[1].split("]")[0].trim().replace(/['"()\[\]\/\\]/g, "");
                addMessage('maya', p[0]);

                // SERVIDOR TURBO + FORÇAR REALISMO
                const basePrompt = "ultra photorealistic, realistic face, 8k resolution, extremely detailed, ";
                const randomSeed = Math.floor(Math.random() * 1000000);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(basePrompt + descFoto)}?width=1024&height=1024&nologo=true&model=turbo&seed=${randomSeed}`;
                
                setTimeout(() => addMessage('maya', url, true), 800);
            } else {
                addMessage('maya', aiResponse);
            }
            contexto.push({ role: "assistant", content: aiResponse });

        } catch (e) {
            statusTop.innerText = "Erro de Chave!";
            if(e.message.includes("401")) {
                addMessage('maya', "Ops! Sua chave API está errada ou expirou.👋");
            } else {
                addMessage('maya', "Tive um problema de conexão. Tente novamente em alguns segundos.😃");
            }
        }
    }

    sendBtn.onclick = processarAcao;
    inputField.onkeypress = function(e) { if(e.key === "Enter") processarAcao(); };
</script>
</body>
</html>
