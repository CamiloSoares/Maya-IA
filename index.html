<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya IA - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <style>
        :root { --bg: #0b141a; --panel: #111b21; --accent: #00a884; --maya: #202c33; --user: #005c4b; --text: #e9edef; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid #222d34; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .sidebar img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 10px; }
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #0b141a; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 16px; border-radius: 10px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: var(--user); }
        .maya { align-self: flex-start; background: var(--maya); border: 1px solid #313d45; }
        .img-card img { width: 100%; border-radius: 8px; border: 1px solid var(--accent); margin-top: 8px; }
        .input-area { padding: 15px; background: var(--panel); display: flex; gap: 10px; }
        input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: white; outline: none; }
        button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #debug-log { position: absolute; top: 5px; right: 5px; font-size: 10px; color: #555; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <img src="https://drive.google.com/thumbnail?id=14aBAq3ow-kFGGLHDGlb9-Q_fc3fHWmXV&sz=w500" alt="Maya">
        <h3 style="margin: 0;">Maya IA</h3>
        <p style="font-size: 12px; color: var(--accent);">● Online no GitHub</p>
    </aside>
    <main class="chat-container">
        <div id="debug-log">Iniciando sistema...</div>
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Digite aqui...">
            <button onclick="askMaya()">Enviar</button>
        </div>
    </main>

<script>
    const API_KEY = "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"; 
    const chatWindow = document.getElementById('chat-window');
    const log = document.getElementById('debug-log');
    let context = [{ role: "system", content: "Você é a Maya, assistente 3D. Se pedir foto, use: [GERAR_FOTO: descrição]." }];

    function printLog(msg) { log.innerText = msg; console.log(msg); }

    function addMsg(role, text, isImg = false) {
        const div = document.createElement('div');
        div.className = `bubble ${role}`;
        if(isImg) {
            div.innerHTML = `<img src="${text}" style="width:100%">`;
            div.classList.add('img-card');
        } else {
            // Verifica se marked existe antes de usar
            div.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
        }
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function askMaya() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMsg('user', text);
        input.value = '';
        context.push({ role: "user", content: text });
        printLog("Maya pensando...");

        try {
            const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${API_KEY}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile", 
                    messages: context 
                })
            });

            if(!resp.ok) throw new Error("Erro na API: " + resp.status);

            const data = await resp.json();
            let aiMsg = data.choices[0].message.content;
            printLog("Resposta recebida!");

            if (aiMsg.includes("[GERAR_FOTO:")) {
                const parts = aiMsg.split("[GERAR_FOTO:");
                const desc = parts[1].split("]")[0];
                addMsg('maya', parts[0]);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent("3D Pixar girl, " + desc)}?nologo=true`;
                addMsg('maya', url, true);
            } else {
                addMsg('maya', aiMsg);
            }
            context.push({ role: "assistant", content: aiMsg });
        } catch (e) {
            printLog("Erro: " + e.message);
            addMsg('maya', "Desculpe, tive um problema: " + e.message);
        }
    }
</script>
</body>
</html>
