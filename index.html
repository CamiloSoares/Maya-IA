<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya IA - Estação Turbo</title>
    <style>
        :root { --bg: #0b141a; --panel: #111b21; --accent: #00a884; --maya: #202c33; --user: #005c4b; --text: #e9edef; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Visual */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #222d34; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sidebar img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 15px rgba(0, 168, 132, 0.3); }
        .status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; margin-right: 5px; animation: pulse 1.5s infinite; }

        /* Área do Chat */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; position: relative; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        /* Bolhas de Mensagem */
        .bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 14px; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 2px; }
        .maya { align-self: flex-start; background: var(--maya); border: 1px solid #313d45; border-bottom-left-radius: 2px; }
        
        /* Card de Imagem Turbo */
        .img-card { margin-top: 10px; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent); max-width: 400px; background: #000; min-height: 250px; display: flex; align-items: center; justify-content: center; position: relative; }
        .img-card img { width: 100%; display: block; height: auto; transition: opacity 0.5s; }
        .loading-frame { position: absolute; color: var(--accent); font-size: 12px; text-align: center; padding: 20px; }

        /* Entrada de Texto */
        .input-area { padding: 15px; background: var(--panel); border-top: 1px solid #222d34; display: flex; gap: 10px; }
        input { flex: 1; background: #2a3942; border: 1px solid #313d45; padding: 12px; border-radius: 8px; color: white; outline: none; font-size: 14px; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        
        #status-top { position: absolute; top: 10px; right: 20px; font-size: 10px; color: var(--accent); opacity: 0.7; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <img src="https://drive.google.com/thumbnail?id=14aBAq3ow-kFGGLHDGlb9-Q_fc3fHWmXV&sz=w500" alt="Maya">
        <h3 style="margin: 5px 0;">Maya IA</h3>
        <p style="font-size: 11px; color: #8696a0;"><span class="status-dot"></span> Motor Turbo v4.3</p>
    </aside>
    
    <main class="chat-container">
        <div id="status-top">Sistema Pronto</div>
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Converse com a Maya ou peça uma foto...">
            <button id="send-btn">Enviar</button>
        </div>
    </main>

<script>
    // 1. CHAVE DA API (Substitua pela sua gsk_...)
    const API_KEY = "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"; 

    const chatWindow = document.getElementById('chat-window');
    const inputField = document.getElementById('user-input');
    const statusTop = document.getElementById('status-top');
    const sendBtn = document.getElementById('send-btn');

    let context = [
        { 
            role: "system", 
            content: "Você é a Maya, assistente 3D amigável estilo Pixar. Use emojis nativos. Quando pedirem foto, descreva a cena e termine com: [GERAR_FOTO: descrição detalhada em inglês]." 
        }
    ];

    function addMessage(role, text, isImg = false) {
        const div = document.createElement('div');
        div.className = "bubble " + role;
        
        if(isImg) {
            div.className += " img-card";
            div.innerHTML = '<div class="loading-frame">🎨 Maya está desenhando...</div>' +
                            '<img src="' + text + '" style="display:none; opacity:0;" ' +
                            'onload="this.style.display=\'block\'; setTimeout(()=>this.style.opacity=\'1\', 50); this.previousSibling.style.display=\'none\';" ' +
                            'onerror="this.parentElement.innerHTML=\'<div style=\\\'padding:20px;text-align:center;\\\'>Erro ao carregar imagem 📷<br><small>Tente pedir novamente.</small></div>\';">';
        } else {
            div.innerText = text;
        }
        
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function askMaya() {
        const text = inputField.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputField.value = "";
        context.push({ role: "user", content: text });
        statusTop.innerText = "Maya pensando...";

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": "Bearer " + API_KEY, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile", 
                    messages: context,
                    temperature: 0.7 
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error.message || "Erro API");

            let aiText = data.choices[0].message.content;
            statusTop.innerText = "Sistema Pronto";

            if (aiText.includes("[GERAR_FOTO:")) {
                const parts = aiText.split("[GERAR_FOTO:");
                const descRaw = parts[1].split("]")[0].trim();
                const descClean = descRaw.replace(/['"()\[\]\/\\]/g, ""); 
                
                addMessage('maya', parts[0].trim());
                
                // MOTOR TURBO: Estilo consistente + Seed aleatória para evitar cache de erro
                const style = "masterpiece, 3d render, pixar style, cute 3d girl avatar, tech outfit, cinematic, ";
                const randomSeed = Math.floor(Math.random() * 100000);
                const imgUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(style + descClean) + "?width=1024&height=1024&nologo=true&model=turbo&seed=" + randomSeed;
                
                setTimeout(() => addMessage('maya', imgUrl, true), 500);
            } else {
                addMessage('maya', aiText);
            }
            context.push({ role: "assistant", content: aiText });

        } catch (e) {
            statusTop.innerText = "Erro!";
            addMessage('maya', "Tive um problema de conexão. Verifique sua internet ou a chave API. 😃");
        }
    }

    // Eventos de Envio
    sendBtn.onclick = askMaya;
    inputField.onkeypress = function(e) {
        if (e.key === "Enter") askMaya();
    };
</script>
</body>
</html>
