<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Maya IA - Online</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0b141a; --panel: #111b21; --accent: #00a884; --maya: #202c33; --user: #005c4b; --text: #e9edef; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid #222d34; padding: 20px; display: flex; flex-direction: column; text-align: center; }
        .sidebar img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 15px; }
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-window { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 18px; border-radius: 12px; max-width: 75%; animation: fadeIn 0.3s ease; }
        .user { align-self: flex-end; background: var(--user); }
        .maya { align-self: flex-start; background: var(--maya); border: 1px solid #313d45; }
        .img-card img { width: 100%; border-radius: 10px; border: 2px solid var(--accent); margin-top: 10px; }
        .input-area { padding: 20px; background: var(--panel); display: flex; gap: 12px; }
        input { flex: 1; background: #2a3942; border: none; padding: 14px; border-radius: 8px; color: white; outline: none; }
        button { background: var(--accent); border: none; padding: 14px 25px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #loading { display: none; color: var(--accent); font-size: 13px; padding: 10px; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <img src="https://drive.google.com/thumbnail?id=14aBAq3ow-kFGGLHDGlb9-Q_fc3fHWmXV&sz=w500" alt="Maya">
        <h2>Maya IA</h2>
        <p style="color: var(--accent)">● Online</p>
    </aside>
    <main class="chat-container">
        <div id="chat-window"></div>
        <div id="loading">Maya está digitando...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Converse com a Maya...">
            <button onclick="askMaya()">Enviar</button>
        </div>
    </main>

<script>
    const API_KEY = "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"; 
    const chatWindow = document.getElementById('chat-window');
    const loading = document.getElementById('loading');
    let context = [{ role: "system", content: "Você é a Maya, assistente 3D amigável. Se o usuário pedir foto, use: [GERAR_FOTO: descrição em inglês]." }];

    function addMessage(role, text, isImg = false) {
        const div = document.createElement('div');
        div.className = `bubble ${role}`;
        div.innerHTML = isImg ? `<img src="${text}">` : marked.parse(text);
        if(isImg) div.classList.add('img-card');
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function askMaya() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';
        context.push({ role: "user", content: text });
        loading.style.display = 'block';

        try {
            const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: context })
            });

            const data = await resp.json();
            loading.style.display = 'none';

            let aiMsg = data.choices[0].message.content;
            if (aiMsg.includes("[GERAR_FOTO:")) {
                const parts = aiMsg.split("[GERAR_FOTO:");
                const desc = parts[1].split("]")[0];
                addMessage('maya', parts[0]);
                addMessage('maya', `https://image.pollinations.ai/prompt/${encodeURIComponent("3D Pixar girl avatar, " + desc)}?nologo=true&model=flux`, true);
            } else {
                addMessage('maya', aiMsg);
            }
            context.push({ role: "assistant", content: aiMsg });
        } catch (e) {
            loading.style.display = 'none';
            addMessage('maya', "Erro: " + e.message);
        }
    }
</script>
</body>
</html>
