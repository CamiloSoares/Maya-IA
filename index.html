<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Maya IA - Versão 5.0</title>
    <style>
        :root { --bg: #0b141a; --panel: #111b21; --accent: #00a884; --text: #e9edef; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .b { padding: 12px; border-radius: 10px; max-width: 80%; font-size: 14px; line-height: 1.5; }
        .u { align-self: flex-end; background: #005c4b; }
        .m { align-self: flex-start; background: #202c33; border: 1px solid #313d45; }
        .img-box { margin-top: 10px; border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; background: #000; }
        .img-box img { width: 100%; display: block; }
        .bar { padding: 15px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid #222d34; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
        button { padding: 10px 20px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #st { position: fixed; top: 10px; right: 20px; font-size: 10px; color: var(--accent); }
    </style>
</head>
<body>
    <div id="st">Maya Pronta</div>
    <div id="chat"></div>
    <div class="bar">
        <input type="text" id="in" placeholder="Diga algo para a Maya...">
        <button onclick="processar()">Enviar</button>
    </div>

<script>
    // --- CONFIGURAÇÃO ---
    const MINHA_CHAVE = "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"; 

    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const status = document.getElementById('st');

    // --- FUNÇÃO DE VOZ (AUDIO) ---
    function falar(texto) {
        // Cancela falas anteriores
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = texto.replace(/\[GERAR_FOTO:.*?\]/g, ""); // Não fala a tag da foto
        msg.lang = 'pt-BR';
        msg.rate = 1.1; // Velocidade
        window.speechSynthesis.speak(msg);
    }

    // --- ADICIONAR NA TELA ---
    function print(tipo, txt, ehImg = false) {
        const d = document.createElement('div');
        d.className = "b " + tipo;
        if(ehImg) {
            d.className += " img-box";
            d.innerHTML = `<img src="${txt}" onload="chat.scrollTop = chat.scrollHeight" onerror="this.parentElement.innerHTML='Erro na imagem 📷'">`;
        } else {
            d.innerText = txt;
        }
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    // --- LÓGICA PRINCIPAL ---
    async function processar() {
        const prompt = input.value.trim();
        if(!prompt) return;

        print('u', prompt);
        input.value = "";
        status.innerText = "Maya pensando...";

        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + MINHA_CHAVE, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "system", content: "Você é a Maya, assistente amigável. Se pedirem foto, use: [GERAR_FOTO: descrição em inglês]"}, {role: "user", content: prompt}]
                })
            });

            const data = await r.json();
            const resposta = data.choices[0].message.content;
            status.innerText = "Maya Pronta";

            // 1. A Maya Fala!
            falar(resposta);

            // 2. Lógica de Imagem
            if(resposta.includes("[GERAR_FOTO:")) {
                const p = resposta.split("[GERAR_FOTO:");
                const desc = p[1].split("]")[0].trim().replace(/[^a-zA-Z0-9 ]/g, "");
                print('m', p[0]);
                
                // Servidor de imagem redundante
                const url = `https://image.pollinations.ai/prompt/3d%20render%20pixar%20style%20girl%20avatar%20${encodeURIComponent(desc)}?nologo=true&seed=${Date.now()}`;
                setTimeout(() => print('m', url, true), 500);
            } else {
                print('m', resposta);
            }

        } catch (e) {
            status.innerText = "Erro!";
            print('m', "Erro de conexão: " + e.message);
        }
    }

    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') processar(); });
</script>
</body>
</html>
